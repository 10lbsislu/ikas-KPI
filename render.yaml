services:
  - type: web
    name: pakyurek-kpi-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pakyurek-kpi-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: pakyurek-kpi-db
    plan: free
    databaseName: kpi
